name: Build FristFox Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract FristFox project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q FristFox_Android_BuildSource_1.0.1.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build release App Bundle
        working-directory: project
        run: gradle --no-daemon --stacktrace clean bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: FristFox-1.0.1-unsigned-AAB
          path: project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
