name: Build FristFox Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract FristFox project
        run: |
          mkdir -p project
          unzip -q FristFox_Android_BuildSource_1.0.1.zip -d project

      - name: Build release App Bundle
        working-directory: project
        run: gradle --no-daemon clean bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: FristFox-1.0.1-unsigned-AAB
          path: project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
